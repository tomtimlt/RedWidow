# RedWidow Serveur (ADR 0052, point 7). Installation guidée : scripts/server-install.sh.
# Seuls les ports 80/443 de Caddy sont publiés ; le serveur (8080) reste sur le réseau interne `web`.
name: redwidow

services:
  redwidow:
    build:
      context: .
      dockerfile: containers/server/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        DOCKER_CLI_IMAGE: ${DOCKER_CLI_IMAGE:-docker:27-cli}
    image: redwidow:local
    env_file: .env
    environment:
      REDWIDOW_HOST: 0.0.0.0
      REDWIDOW_TRUST_PROXY: "1"
    volumes:
      - redwidow-data:/data
      # ATTENTION : le socket Docker donne au conteneur les droits de l'hôte (root de fait).
      # À réserver à un VPS dédié (ADR 0052). Le serveur s'en sert pour piloter les conteneurs
      # Kali/Exegol ; l'agent, lui, ne le voit jamais.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # gid du groupe `docker` de l'hôte (détecté par scripts/server-install.sh : stat -c %g /var/run/docker.sock).
      - "${DOCKER_GID:-999}"
    networks: [web]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Pas de `init: true` : l'image embarque déjà tini comme point d'entrée.
    restart: unless-stopped

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./containers/server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    depends_on: [redwidow]
    restart: unless-stopped

  # Image Kali optionnelle (`docker compose --profile tools build kali`) : le serveur pilote lui-même
  # ses conteneurs Kali par le socket ; ce service ne le reçoit PAS et vit sur un réseau séparé.
  kali:
    profiles: [tools]
    build:
      context: containers/kali
    image: redwidow-kali:local
    command: ["sleep", "infinity"]
    init: true
    networks: [tools]
    restart: "no"

networks:
  web: {}
  tools: {}

volumes:
  redwidow-data: {}
  caddy_data: {}
  caddy_config: {}
