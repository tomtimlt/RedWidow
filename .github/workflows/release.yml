name: Release

# Publie une release GitHub avec les VSIX (win32-x64, linux-x64, darwin-arm64 et darwin-x64) quand un tag vX.Y.Z est poussé.
# Le tag doit être égal à la version de packages/vscode/extension.manifest.json (sans le « v »).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Pas d'annulation : une release à moitié publiée est pire qu'une release en attente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Lecture seule par défaut ; l'écriture n'est demandée que par le job de publication.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Seule l'étape de publication utilise GH_TOKEN ; le dépôt est extrait sans identifiants persistants.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Le tag correspond à la version de l'extension
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/vscode/extension.manifest.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "Le tag ${TAG} ne correspond pas à la version ${version} de extension.manifest.json" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

      # Linux : le binaire du SDK installé par défaut est celui du runner.
      - run: pnpm --filter @warband/vscode package linux-x64

      # Windows : deuxième installation avec les paquets optionnels de la cible (esbuild reste celui du runner).
      - run: pnpm install --frozen-lockfile --os=win32 --cpu=x64
      - run: pnpm --filter @warband/vscode package win32-x64

      # macOS (Apple Silicon puis Intel) : même principe, paquets optionnels de la cible.
      - run: pnpm install --frozen-lockfile --os=darwin --cpu=arm64
      - run: pnpm --filter @warband/vscode package darwin-arm64
      - run: pnpm install --frozen-lockfile --os=darwin --cpu=x64
      - run: pnpm --filter @warband/vscode package darwin-x64

      - name: Empreintes SHA-256
        working-directory: packages/vscode
        run: |
          for f in warband-${VERSION}-*.vsix; do sha256sum "$f" > "$f.sha256"; done
          ls -l warband-${VERSION}-*

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: packages/vscode
        run: |
          files=(warband-${VERSION}-*.vsix warband-${VERSION}-*.vsix.sha256)
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --clobber
          else
            gh release create "${TAG}" "${files[@]}" \
              --verify-tag \
              --title "RedWidow ${VERSION}" \
              --generate-notes
          fi
