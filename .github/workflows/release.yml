name: Release

# Publie une release GitHub avec les VSIX (win32-x64, linux-x64, darwin-arm64 et darwin-x64).
# Deux déclencheurs :
# - push sur main qui modifie packages/vscode/extension.manifest.json : si le tag v<version> n'existe pas
#   encore, le workflow crée le tag sur ce commit et la release (rien à faire à la main) ;
# - push d'un tag vX.Y.Z : le tag doit être égal à la version du manifeste (sans le « v »).
# - lancement manuel (workflow_dispatch) avec `prerelease: true`, depuis une branche : pré-release de test,
#   tag v<version>-pre.<n° d'exécution>, marquée « pre-release » sur GitHub, JAMAIS publiée sur le Marketplace.
# Un tag créé par le jeton du workflow ne relance pas ce workflow.
on:
  push:
    branches:
      - main
    paths:
      - packages/vscode/extension.manifest.json
      - .github/workflows/release.yml
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pré-release de test (depuis une branche) : tag v<version>-pre.<n° d'exécution>, sans Marketplace"
        type: boolean
        default: false

# Pas d'annulation : une release à moitié publiée est pire qu'une release en attente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Lecture seule par défaut ; l'écriture n'est demandée que par le job de publication.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Seule l'étape de publication utilise GH_TOKEN ; le dépôt est extrait sans identifiants persistants.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Version et tag de la release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          version="$(node -p "require('./packages/vscode/extension.manifest.json').version")"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          # Pré-release de test : tag unique par exécution, release marquée « pre-release », pas de Marketplace.
          if [ "${PRERELEASE_INPUT}" = "true" ]; then
            if [ "${REF_TYPE}" != "branch" ]; then
              echo "Une pré-release se lance depuis une branche, pas depuis ${REF_TYPE} ${REF_NAME}" >&2
              exit 1
            fi
            echo "TAG=v${version}-pre.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${REF_TYPE}" = "tag" ]; then
            if [ "v${version}" != "${REF_NAME}" ]; then
              echo "Le tag ${REF_NAME} ne correspond pas à la version ${version} de extension.manifest.json" >&2
              exit 1
            fi
            echo "TAG=${REF_NAME}" >> "$GITHUB_ENV"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v${version}"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > /dev/null 2>&1; then
            echo "::notice::Le tag ${tag} existe déjà : rien à publier (changez la version pour une nouvelle release)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm install --frozen-lockfile
        if: steps.tag.outputs.skip != 'true'
      - run: pnpm check
        if: steps.tag.outputs.skip != 'true'
      - run: pnpm build
        if: steps.tag.outputs.skip != 'true'

      # Linux : le binaire du SDK installé par défaut est celui du runner.
      - run: pnpm --filter @warband/vscode package linux-x64
        if: steps.tag.outputs.skip != 'true'

      # Windows : deuxième installation avec les paquets optionnels de la cible (esbuild reste celui du runner).
      - run: pnpm install --frozen-lockfile --os=win32 --cpu=x64
        if: steps.tag.outputs.skip != 'true'
      - run: pnpm --filter @warband/vscode package win32-x64
        if: steps.tag.outputs.skip != 'true'

      # macOS (Apple Silicon puis Intel) : même principe, paquets optionnels de la cible.
      - run: pnpm install --frozen-lockfile --os=darwin --cpu=arm64
        if: steps.tag.outputs.skip != 'true'
      - run: pnpm --filter @warband/vscode package darwin-arm64
        if: steps.tag.outputs.skip != 'true'
      - run: pnpm install --frozen-lockfile --os=darwin --cpu=x64
        if: steps.tag.outputs.skip != 'true'
      - run: pnpm --filter @warband/vscode package darwin-x64
        if: steps.tag.outputs.skip != 'true'

      - name: Empreintes SHA-256
        if: steps.tag.outputs.skip != 'true'
        working-directory: packages/vscode
        run: |
          # Pré-release : le numéro d'exécution dans le nom évite toute confusion avec la version publiée.
          if [ "${PRERELEASE:-}" = "true" ]; then
            for f in redwidow-${VERSION}-*.vsix; do
              mv "$f" "${f/redwidow-${VERSION}-/redwidow-${VERSION}-pre.${GITHUB_RUN_NUMBER}-}"
            done
          fi
          for f in redwidow-${VERSION}-*.vsix; do sha256sum "$f" > "$f.sha256"; done
          ls -l redwidow-${VERSION}-*

      - name: Publier la release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
        working-directory: packages/vscode
        run: |
          NOTES="$(mktemp)"
          extra=()
          title="Red Widow v${VERSION} — AI pentest agents for your Kali, inside VS Code"
          if [ "${PRERELEASE:-}" = "true" ]; then
            printf '%s\n' \
              "Pré-version de test, non publiée sur le Marketplace." \
              "" \
              "Branche : ${GITHUB_REF_NAME}" \
              "Commit : ${GITHUB_SHA}" \
              "" \
              "À installer à la main : « Extensions : Installer à partir d'un VSIX… » (désinstaller d'abord la version publiée)." \
              > "${NOTES}"
            extra=(--prerelease)
            title="Red Widow v${VERSION} — pré-release de test (${GITHUB_REF_NAME})"
          else
            sed "s/__VERSION__/${VERSION}/" "${GITHUB_WORKSPACE}/.github/release-notes.md" > "${NOTES}"
          fi
          files=(redwidow-${VERSION}-*.vsix redwidow-${VERSION}-*.vsix.sha256)
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --clobber
          else
            # Tag poussé : il doit exister. Push sur main : la release crée le tag sur ce commit.
            if [ "${REF_TYPE}" = "tag" ]; then where=(--verify-tag); else where=(--target "${GITHUB_SHA}"); fi
            gh release create "${TAG}" "${files[@]}" \
              "${where[@]}" \
              --title "${title}" \
              "${extra[@]}" \
              --notes-file "${NOTES}"
          fi

      # Marketplace VS Code : seulement si le secret VSCE_PAT existe (voir docs/publier-marketplace.md).
      # Le VSIX publié est exactement celui de la release. Une version déjà publiée est ignorée.
      - name: Publier sur le Marketplace VS Code
        if: steps.tag.outputs.skip != 'true' && steps.tag.outputs.prerelease != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        working-directory: packages/vscode
        run: |
          if [ "${PRERELEASE:-}" = "true" ]; then
            echo "::notice::Pré-release : publication Marketplace ignorée."
            exit 0
          fi
          if [ -z "${VSCE_PAT}" ]; then
            echo "::notice::Secret VSCE_PAT absent : publication Marketplace ignorée."
            exit 0
          fi
          # Une plateforme par appel, avec une pause : envoyées d'un seul appel, seule la
          # première version était retenue par le Marketplace (1.0.7).
          status=0
          for f in redwidow-${VERSION}-*.vsix; do
            pnpm exec vsce publish --skip-duplicate --packagePath "$f" || status=1
            sleep 60
          done
          exit $status
