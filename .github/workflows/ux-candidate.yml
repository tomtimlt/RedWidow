name: Candidat UX

on:
  push:
    tags:
      - "ux-rc-*"

permissions:
  contents: read

# Un seul producteur par tag, y compris lors d'une relance.
concurrency:
  group: ux-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier l'ascendance du candidat
        run: git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/refonte/experience-modulaire

  linux:
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: python -m pip install "jsonschema>=4.18" referencing
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: node packages/vscode/scripts/check-opencode.mjs
      - run: node packages/cli/dist/main.js --help

  windows:
    needs: source
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: node packages/vscode/scripts/check-opencode.mjs
      - run: node packages/cli/dist/main.js --help

  publication:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @warband/vscode package linux-x64
      - run: pnpm install --frozen-lockfile --os=win32 --cpu=x64
      - run: pnpm --filter @warband/vscode package win32-x64
      - run: pnpm install --frozen-lockfile --os=darwin --cpu=arm64
      - run: pnpm --filter @warband/vscode package darwin-arm64
      - run: pnpm install --frozen-lockfile --os=darwin --cpu=x64
      - run: pnpm --filter @warband/vscode package darwin-x64
      - name: Empreintes SHA-256
        working-directory: packages/vscode
        run: |
          version="$(node -p "require('./extension.manifest.json').version")"
          for target in linux-x64 win32-x64 darwin-arm64 darwin-x64; do
            f="redwidow-${version}-${target}.vsix"
            test -s "$f"
            sha256sum "$f" > "$f.sha256"
          done
      - name: Publier le candidat
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: packages/vscode
        run: |
          # Résout aussi un tag annoté jusqu'au commit, sans modifier le tag.
          verifier_tag() {
            # Authentification temporaire pour les dépôts privés, sans persistance sur disque.
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            remote="$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
            commit="$(printf '%s\n' "$remote" | awk -v ref="refs/tags/$TAG^{}" '$2 == ref { print $1 }')"
            if [ -z "$commit" ]; then
              commit="$(printf '%s\n' "$remote" | awk -v ref="refs/tags/$TAG" '$2 == ref { print $1 }')"
            fi
            if [ "$commit" != "$GITHUB_SHA" ]; then
              echo "::error::Le tag distant ne pointe pas sur le commit validé."
              exit 1
            fi
          }
          verifier_tag
          # Une relance ne remplace jamais une publication déjà créée.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Une release existe déjà pour ce tag."
            exit 1
          fi
          version="$(node -p "require('./extension.manifest.json').version")"
          files=()
          for target in linux-x64 win32-x64 darwin-arm64 darwin-x64; do
            f="redwidow-${version}-${target}.vsix"
            files+=("$f" "$f.sha256")
          done
          gh release create "$TAG" "${files[@]}" --verify-tag --prerelease --latest=false \
            --title "Candidat UX ${TAG}" \
            --notes "Candidat UX construit depuis le commit ${GITHUB_SHA}."
          verifier_tag
