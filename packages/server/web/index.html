<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RedWidow</title>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/shell.css" />
    <link rel="stylesheet" href="/wm.css" />
  </head>
  <body class="shell">
    <header id="topbar">
      <span class="tb-brand">
        <img class="tb-logo" src="/media/logo-small.svg" alt="" width="22" height="22" />
        <span class="tb-name">RedWidow</span>
      </span>
      <button id="tb-count" class="tb-count" type="button" aria-label="Aucune demande en attente">0</button>
      <button id="tb-preview" class="tb-preview" type="button" hidden></button>
      <span id="tb-conn" class="tb-conn" role="status" data-state="closed">Connexion…</span>
      <span id="tb-bypass" class="tb-bypass" hidden></span>
      <span id="tb-halt-note" class="tb-halt-note" role="status" hidden></span>
      <button id="tb-halt" class="tb-halt" type="button" data-state="idle">Arrêt d'urgence</button>
    </header>

    <main id="desktop" aria-label="Bureau">
      <div id="confirm-zone" class="confirm-zone" hidden></div>
    </main>

    <nav id="dock" class="dock" aria-label="Fenêtres" data-mode="desktop">
      <div id="dock-items" class="dock-items"></div>
      <div class="dock-open">
        <div id="dock-menu" class="dock-menu" role="menu" aria-label="Ouvrir une fenêtre" hidden></div>
        <button id="dock-open" class="dock-open-btn" type="button">Ouvrir</button>
      </div>
    </nav>

    <!-- Réserve : l'écran Approbations est hébergé par sa fenêtre dès qu'elle s'ouvre. -->
    <div id="wm-stash" hidden>
      <section id="screen-approvals" class="screen" aria-labelledby="appr-title">
        <h1 id="appr-title">Approbations</h1>
        <p id="appr-empty" class="empty"></p>
        <div id="appr-list" class="appr-list" hidden></div>
      </section>
    </div>

    <aside id="sheet" class="sheet" aria-label="Demande d'approbation" hidden>
      <div id="sheet-list" class="appr-list"></div>
      <button id="sheet-open" type="button" class="sheet-open">Ouvrir la file</button>
    </aside>

    <script type="module" nonce="{{nonce}}" src="/shell.js"></script>
  </body>
</html>
