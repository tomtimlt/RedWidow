<text x="484" y="82" font-family="Geist Mono" font-weight="700" font-size="16" letter-spacing="2.6" fill="#e8eaed">VENATOR <tspan fill="#3cc7c0">OPS</tspan></text>
<text y="184" font-family="Geist" font-weight="600" font-size="40" letter-spacing="-1" fill="#e8eaed"><tspan x="440" dy="0">Offensive security,</tspan><tspan x="440" dy="43.2">operated by an agent.</tspan></text>
