<rect x="960" y="78" width="580" height="236" rx="10" fill="#16191c" stroke="#262b30"/><line x1="960" x2="1540" y1="128" y2="128" stroke="#262b30"/><text x="982" y="108" font-family="Geist" font-size="10.4" font-weight="500" letter-spacing="0.4" fill="#636c76">PROBLEMS</text><text x="1061.584" y="108" font-family="Geist" font-size="10.4" font-weight="500" letter-spacing="0.4" fill="#636c76">OUTPUT</text><text x="1128.2720000000002" y="108" font-family="Geist" font-size="10.4" font-weight="500" letter-spacing="0.4" fill="#e8eaed">TERMINAL</text><rect x="1128.2720000000002" y="117" width="57.584" height="1.5" fill="#e8eaed"/><text x="1207.8560000000002" y="108" font-family="Geist" font-size="10.4" font-weight="500" letter-spacing="0.4" fill="#636c76">PORTS</text><text x="982" y="152" font-family="Geist Mono" font-size="13" fill="#9aa3ad"><tspan fill="#3cc7c0">exegol-lab</tspan> <tspan fill="#636c76">~</tspan> <tspan fill="#e8eaed">venator run --scope 10.10.0.0/24</tspan></text><text x="982" y="182.7125" font-family="Geist Mono" font-size="13"><tspan fill="#3fb950">●</tspan><tspan dx="7.8" fill="#9aa3ad">recon</tspan></text><text x="1078.2" y="182.7125" font-family="Geist Mono" font-size="13" fill="#e8eaed">nmap -sV -T4 10.10.0.0/24</text><text x="1518" y="182.7125" text-anchor="end" font-family="Geist Mono" font-size="13" fill="#9aa3ad">12 hosts up</text><text x="982" y="205.4625" font-family="Geist Mono" font-size="13"><tspan fill="#3fb950">●</tspan><tspan dx="7.8" fill="#9aa3ad">analysis</tspan></text><text x="1078.2" y="205.4625" font-family="Geist Mono" font-size="13" fill="#e8eaed">http-enum 10.10.0.14:8080</text><text x="1518" y="205.4625" text-anchor="end" font-family="Geist Mono" font-size="13" fill="#9aa3ad">3 findings</text><text x="982" y="228.2125" font-family="Geist Mono" font-size="13"><tspan fill="#d29922">●</tspan><tspan dx="7.8" fill="#9aa3ad">action</tspan></text><text x="1078.2" y="228.2125" font-family="Geist Mono" font-size="13" fill="#e8eaed">sqlmap -u …/login --batch</text><text x="1518" y="228.2125" text-anchor="end" font-family="Geist Mono" font-size="13" fill="#d29922">approval required</text><text x="982" y="250.96249999999998" font-family="Geist Mono" font-size="13"><tspan fill="#636c76">○</tspan><tspan dx="7.8" fill="#9aa3ad">report</tspan></text><text x="1078.2" y="250.96249999999998" font-family="Geist Mono" font-size="13" fill="#e8eaed">draft</text><text x="1518" y="250.96249999999998" text-anchor="end" font-family="Geist Mono" font-size="13" fill="#636c76">pending</text><text x="982" y="279.4" xml:space="preserve" font-family="Geist Mono" font-size="13" fill="#636c76"><tspan fill="#9aa3ad">[y]</tspan> approve once  <tspan fill="#9aa3ad">[n]</tspan> deny  <tspan fill="#9aa3ad">[a]</tspan> always</text><rect x="1286.2" y="268.34999999999997" width="7.15" height="13.65" fill="#e8eaed"/>
