<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img"><title>Venator Ops — offensive security, operated by an agent</title>
<rect width="1280" height="640" fill="#101214"/>
<g transform="translate(72 170) scale(1.25)"><path d="M3 8.5V3h5.5M15.5 3H21v5.5M21 15.5V21h-5.5M8.5 21H3v-5.5" fill="none" stroke="#7d8b99" stroke-width="1.8" stroke-linecap="square"/><path d="M12 5c.8 3.9 3.1 6.2 7 7-3.9.8-6.2 3.1-7 7-.8-3.9-3.1-6.2-7-7 3.9-.8 6.2-3.1 7-7z" fill="#3cc7c0"/><circle cx="17.4" cy="6.6" r="1.3" fill="#3cc7c0"/></g>
<text x="116" y="195" font-family="Geist Mono" font-weight="700" font-size="16" letter-spacing="2.6" fill="#e8eaed">VENATOR <tspan fill="#3cc7c0">OPS</tspan></text>
<text y="303.4" font-family="Geist" font-weight="600" font-size="48" letter-spacing="-1.2000000000000002" fill="#e8eaed"><tspan x="72" dy="0">Offensive security,</tspan><tspan x="72" dy="51.84">operated by an agent.</tspan></text>
<text y="406.68" font-family="Geist" font-size="20" fill="#9aa3ad"><tspan x="72" dy="0">Plans, runs and reports on Exegol and Kali</tspan><tspan x="72" dy="29">from inside VS Code. You approve every action.</tspan></text>
<text x="72" y="478" font-family="Geist Mono" font-size="13" letter-spacing="1.6" fill="#636c76">OPEN SOURCE</text><line x1="189.4" x2="189.4" y1="467" y2="480" stroke="#262b30"/><text x="205.4" y="478" font-family="Geist Mono" font-size="13" letter-spacing="1.6" fill="#636c76">EXEGOL</text><line x1="275.8" x2="275.8" y1="467" y2="480" stroke="#262b30"/><text x="291.8" y="478" font-family="Geist Mono" font-size="13" letter-spacing="1.6" fill="#636c76">KALI</text><line x1="343.4" x2="343.4" y1="467" y2="480" stroke="#262b30"/><text x="359.4" y="478" font-family="Geist Mono" font-size="13" letter-spacing="1.6" fill="#636c76">VS CODE</text>
<rect x="664" y="190" width="544" height="250" rx="10" fill="#16191c" stroke="#262b30"/><line x1="664" x2="1208" y1="240" y2="240" stroke="#262b30"/><text x="686" y="220" font-family="Geist" font-size="11.200000000000001" font-weight="500" letter-spacing="0.4" fill="#636c76">PROBLEMS</text><text x="769.552" y="220" font-family="Geist" font-size="11.200000000000001" font-weight="500" letter-spacing="0.4" fill="#636c76">OUTPUT</text><text x="839.216" y="220" font-family="Geist" font-size="11.200000000000001" font-weight="500" letter-spacing="0.4" fill="#e8eaed">TERMINAL</text><rect x="839.216" y="229" width="61.552" height="1.5" fill="#e8eaed"/><text x="922.768" y="220" font-family="Geist" font-size="11.200000000000001" font-weight="500" letter-spacing="0.4" fill="#636c76">PORTS</text><text x="686" y="264" font-family="Geist Mono" font-size="14" fill="#9aa3ad"><tspan fill="#3cc7c0">exegol-lab</tspan> <tspan fill="#636c76">~</tspan> <tspan fill="#e8eaed">venator run --scope 10.10.0.0/24</tspan></text><text x="686" y="297.075" font-family="Geist Mono" font-size="14"><tspan fill="#3fb950">●</tspan><tspan dx="8.4" fill="#9aa3ad">recon</tspan></text><text x="789.6" y="297.075" font-family="Geist Mono" font-size="14" fill="#e8eaed">nmap -sV -T4 10.10.0.0/24</text><text x="1186" y="297.075" text-anchor="end" font-family="Geist Mono" font-size="14" fill="#9aa3ad">12 hosts up</text><text x="686" y="321.575" font-family="Geist Mono" font-size="14"><tspan fill="#3fb950">●</tspan><tspan dx="8.4" fill="#9aa3ad">analysis</tspan></text><text x="789.6" y="321.575" font-family="Geist Mono" font-size="14" fill="#e8eaed">http-enum 10.10.0.14:8080</text><text x="1186" y="321.575" text-anchor="end" font-family="Geist Mono" font-size="14" fill="#9aa3ad">3 findings</text><text x="686" y="346.075" font-family="Geist Mono" font-size="14"><tspan fill="#d29922">●</tspan><tspan dx="8.4" fill="#9aa3ad">action</tspan></text><text x="789.6" y="346.075" font-family="Geist Mono" font-size="14" fill="#e8eaed">sqlmap -u …/login --batch</text><text x="1186" y="346.075" text-anchor="end" font-family="Geist Mono" font-size="14" fill="#d29922">approval required</text><text x="686" y="370.575" font-family="Geist Mono" font-size="14"><tspan fill="#636c76">○</tspan><tspan dx="8.4" fill="#9aa3ad">report</tspan></text><text x="789.6" y="370.575" font-family="Geist Mono" font-size="14" fill="#e8eaed">draft</text><text x="1186" y="370.575" text-anchor="end" font-family="Geist Mono" font-size="14" fill="#636c76">pending</text><text x="686" y="401.2" xml:space="preserve" font-family="Geist Mono" font-size="14" fill="#636c76"><tspan fill="#9aa3ad">[y]</tspan> approve once  <tspan fill="#9aa3ad">[n]</tspan> deny  <tspan fill="#9aa3ad">[a]</tspan> always</text><rect x="1013.6" y="389.3" width="7.700000000000001" height="14.700000000000001" fill="#e8eaed"/>
</svg>
